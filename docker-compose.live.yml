# Docker Compose override for live trading mode
# Use with: python mode_manager.py --mode live --start
# Or: docker-compose -f docker-compose.yml -f docker-compose.live.yml up -d

services:
  # Set live mode for all Zerodha WebSocket collectors
  websocket-tick-collector-banknifty:
    environment:
      TRADING_MODE: live
      ZERODHA_MODE: "live"
      USE_KITE_API: "true"

  # Live LTP collectors
  ltp-collector-banknifty:
    environment:
      TRADING_MODE: live
      ZERODHA_MODE: "live"
      USE_KITE_API: "true"

  ltp-collector-nifty:
    environment:
      TRADING_MODE: live
      ZERODHA_MODE: "live"
      USE_KITE_API: "true"

  # Live trading bots
  trading-bot-banknifty:
    environment:
      TRADING_MODE: live
      PAPER_TRADING: "false"

  trading-bot-nifty:
    environment:
      TRADING_MODE: live
      PAPER_TRADING: "false"

  # Backend services
  backend-banknifty:
    environment:
      TRADING_MODE: live

  backend-nifty:
    environment:
      TRADING_MODE: live

  # Engine and orchestrator
  engine-api:
    environment:
      TRADING_MODE: live

  orchestrator-service:
    environment:
      TRADING_MODE: live

  # Market data API
  market-data-api:
    environment:
      TRADING_MODE: live
      ZERODHA_MODE: "live"