# Common configurations using YAML anchors
x-trading-bot-config: &trading-bot-config
  build: .
  depends_on:
    mongodb:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    - MONGODB_URI=mongodb://mongodb:27017/zerodha_trading
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - DEBUG_AGENT_OUTPUT=true
    - LLM_SELECTION_STRATEGY=weighted
    - LLM_SOFT_THROTTLE_FACTOR=0.8
  volumes:
    - ./logs:/app/logs
  healthcheck:
    test: ["CMD", "sh", "-c", "pgrep -f 'python.*trading' > /dev/null || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  restart: unless-stopped
  networks:
    - trading-network

x-backend-config: &backend-config
  build: .
  depends_on:
    mongodb:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    - MONGODB_URI=mongodb://mongodb:27017/zerodha_trading
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - DEBUG_AGENT_OUTPUT=true
    - LLM_SELECTION_STRATEGY=weighted
    - LLM_SOFT_THROTTLE_FACTOR=0.8
  ports:
    - "8000:8000"
  volumes:
    - ./logs:/app/logs
  command: ["python", "-m", "uvicorn", "dashboard.dashboard_pro:app", "--host", "0.0.0.0", "--port", "8000"]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys;urllib.request.urlopen('http://localhost:8000/health', timeout=5).read();sys.exit(0)"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  restart: unless-stopped
  networks:
    - trading-network

x-collector-config: &collector-config
  build: .
  depends_on:
    redis:
      condition: service_healthy
  environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - PYTHONPATH=/app:/app/market_data/src
  volumes:
    - ./logs:/app/logs
    - ./credentials.json:/app/credentials.json:ro
  healthcheck:
    test: ["CMD", "python", "-c", "print('OK')"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 20s
  restart: unless-stopped
  networks:
    - trading-network

services:
  mongodb:
    image: mongo:7
    container_name: zerodha-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=zerodha_trading
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping') && db.getSiblingDB('zerodha_trading').runCommand({ping: 1})"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network

  redis:
    image: redis:7-alpine
    container_name: zerodha-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli ping | grep -q PONG && redis-cli set health:check test && redis-cli get health:check | grep -q test && redis-cli del health:check"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network

  trading-bot-btc:
    # profile: disabled
    <<: *trading-bot-config
    container_name: zerodha-trading-bot-btc
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - market_data/.env.btc
    volumes:
      - ./logs:/app/logs
      # - ./credentials.json:/app/credentials.json:ro
    command: ["python", "run_orchestrator.py"]

  trading-bot-banknifty:
    # profile: banknifty
    <<: *trading-bot-config
    container_name: zerodha-trading-bot-banknifty
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data-api:
        condition: service_started
    env_file:
      - market_data/.env.banknifty
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
    command: ["python", "run_orchestrator.py"]

  trading-bot-nifty:
    # profile: disabled
    <<: *trading-bot-config
    container_name: zerodha-trading-bot-nifty
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - market_data/.env.nifty
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
    command: ["python", "run_orchestrator.py"]

  backend-btc:
    # profile: disabled
    <<: *backend-config
    container_name: zerodha-backend-btc
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.btc
    ports:
      - "8011:8000"
    volumes:
      - ./logs:/app/logs
      # - ./credentials.json:/app/credentials.json:ro

  backend-banknifty:
    # profile: banknifty
    <<: *backend-config
    container_name: zerodha-backend-banknifty
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ltp-collector-banknifty:
        condition: service_healthy
      depth-collector-banknifty:
        condition: service_healthy
    env_file:
      - market_data/.env.banknifty
    ports:
      - "8002:8000"
    volumes:
      - ./logs:/app/logs
      # - ./credentials.json:/app/credentials.json:ro

  backend-nifty:
    <<: *backend-config
    container_name: zerodha-backend-nifty
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ltp-collector-nifty:
        condition: service_healthy
      depth-collector-nifty:
        condition: service_healthy
    env_file:
      - .env.nifty
    ports:
      - "8003:8000"
    volumes:
      - ./logs:/app/logs
      # - ./credentials.json:/app/credentials.json:ro

  # Collectors: Bank Nifty
  ltp-collector-banknifty:
    # profile: banknifty
    <<: *collector-config
    container_name: zerodha-ltp-collector-banknifty
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - market_data/.env.banknifty
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
      - ./market_data:/app/market_data
    command: ["python", "-m", "market_data.collectors.ltp_collector"]

  depth-collector-banknifty:
    # profile: banknifty
    <<: *collector-config
    container_name: zerodha-depth-collector-banknifty
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - market_data/.env.banknifty
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app:/app/market_data/src:/app/news_module/src
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
    working_dir: /app
    command: ["python", "-m", "market_data.collectors.depth_collector"]

  websocket-tick-collector-banknifty:
    # profile: banknifty
    <<: *collector-config
    container_name: zerodha-websocket-tick-collector-banknifty
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - market_data/.env.banknifty
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app:/app/market_data/src
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
      - ./market_data:/app/market_data
    command: ["python", "-m", "market_data.collectors.websocket_tick_collector"]

  # OHLC Aggregator Service - Generates 1-minute candles from enhanced ticks
  ohlc-aggregator:
    build: .
    container_name: zerodha-ohlc-aggregator
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - market_data/.env.banknifty
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app:/app/market_data/src
      - INSTRUMENT_SYMBOL=BANKNIFTY26FEBFUT
      - EXECUTION_MODE=LIVE
    volumes:
      - ./logs:/app/logs
      - ./market_data:/app/market_data
      - ./redis_key_manager.py:/app/redis_key_manager.py:ro
    command: ["python", "ohlc_aggregator_service.py"]
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'ohlc_aggregator_service' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - trading-network

  # Multi-Timeframe Aggregator Service - Aggregates 1min candles into 5min/15min/1h/4h
  multi-timeframe-aggregator:
    build: .
    container_name: zerodha-multi-timeframe-aggregator
    depends_on:
      redis:
        condition: service_healthy
      ohlc-aggregator:
        condition: service_started
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EXECUTION_MODE=live
    volumes:
      - ./logs:/app/logs
      - ./redis_key_manager.py:/app/redis_key_manager.py:ro
    command: ["python", "multi_timeframe_aggregator.py"]
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'multi_timeframe_aggregator' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - trading-network

  # Collectors: Nifty 50
  ltp-collector-nifty:
    # profile: disabled
    <<: *collector-config
    container_name: zerodha-ltp-collector-nifty
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.nifty
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
    command: ["python", "-m", "market_data.collectors.ltp_collector"]

  depth-collector-nifty:
    # profile: disabled
    <<: *collector-config
    container_name: zerodha-depth-collector-nifty
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.nifty
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
    command: ["python", "-m", "market_data.collectors.depth_collector"]

  # Dashboard service (FastAPI-based trading cockpit)
  # Continuous multi-agent orchestrator service
  orchestrator-service:
    build: .
    container_name: zerodha-orchestrator-service
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.banknifty
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/zerodha_trading
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
    command: ["python", "run_orchestrator.py"]
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'python.*orchestrator' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - trading-network

  # Automatic trading service (executes trades from orchestrator output)
  automatic-trading-service:
    build: .
    container_name: zerodha-automatic-trading-service
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - market_data/.env.banknifty
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/zerodha_trading
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTOTRADE_USER_ID=paper_trader_user_id
      - AUTOTRADE_INSTRUMENT=BANKNIFTY
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
    command: ["python", "-m", "services.automatic_trading_runner"]
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'python.*automatic_trading' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - trading-network

  # Historical data replay service for paper_mock mode
  historical-replay-service:
    build: .
    container_name: zerodha-historical-replay-service
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - market_data/.env.banknifty
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app:/app/market_data/src
      # Historical replay configuration
      # HISTORICAL_DATE is primary (set by docker-compose.historical.yml)
      # These are fallback defaults to prevent crash-loop
      - HISTORICAL_DATE=2026-01-28
      - HISTORICAL_SOURCE=zerodha
      - HISTORICAL_INTERVAL=minute
      - HISTORICAL_SPEED=1.0
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
      - ./market_data:/app/market_data
    command: ["python", "-m", "services.historical_data_replay_service"]
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'python.*historical' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - trading-network

  news-collector:
    build: .
    container_name: zerodha-news-collector
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.news
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/zerodha_trading
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app:/app/news_module/src
      - NEWS_SOURCES=default
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
    command: ["python", "-m", "news_module.tools.collect_news"]
    healthcheck:
      test: ["CMD", "python", "-c", "import news_module; import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - trading-network

  # Market Data API Service
  market-data-api:
    build: .
    container_name: zerodha-market-data-api
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/zerodha_trading
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app:/app/market_data/src:/app/engine_module/src:/app/user_module/src:/app/news_module/src:/app/genai_module/src
      - MARKET_DATA_API_HOST=0.0.0.0
      - MARKET_DATA_API_PORT=8004
      # Environment configuration
      - DEVELOPMENT_MODE=0
      - REDIS_DB=0
      - TRADING_PROVIDER=zerodha
      - ENV=LIVE
      - EXECUTION_MODE=live
      - INSTRUMENT_SYMBOL=BANKNIFTY26FEBFUT
      - INSTRUMENT_TRADING_SYMBOL=
      - INSTRUMENT_EXCHANGE=NFO
    ports:
      - "8004:8004"
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
      - ./market_data:/app/market_data:ro
      - ./redis_key_manager.py:/app/redis_key_manager.py:ro
    command: ["python", "-m", "market_data.api_service"]
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - |
        import urllib.request, json, sys
        try:
          with urllib.request.urlopen('http://localhost:8004/health', timeout=5) as response:
            data = json.loads(response.read().decode())
            status = data.get('status')
            sys.exit(0 if status in ('healthy', 'degraded') else 1)
        except Exception as e:
          print(f'Health check failed: {e}')
          sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - trading-network

  # News API Service
  news-api:
    build: .
    container_name: zerodha-news-api
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/zerodha_trading
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app:/app/news_module/src
      - NEWS_API_HOST=0.0.0.0
      - NEWS_API_PORT=8005
      - NEWS_SOURCES=default
    ports:
      - "8005:8005"
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
    command: ["python", "-m", "news_module.api_service"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;urllib.request.urlopen('http://localhost:8005/health', timeout=5).read();sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - trading-network

  # Engine API Service
  engine-api:
    build: .
    container_name: zerodha-engine-api
    depends_on:
      - redis
      - market-data-api
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/zerodha_trading
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app:/app/engine_module/src
      - ENGINE_API_HOST=0.0.0.0
      - ENGINE_API_PORT=8006
      - ENGINE_ALLOWED_ORIGINS=http://localhost:8888,http://127.0.0.1:8888,http://localhost:3000,http://localhost:5173
      - LLM_SELECTION_STRATEGY=weighted
      - LLM_SOFT_THROTTLE_FACTOR=0.8
    ports:
      - "8006:8006"
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
    command: ["python", "-m", "engine_module.api_service"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;urllib.request.urlopen('http://localhost:8006/health', timeout=5).read();sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - trading-network

  # Redis WebSocket Gateway - Direct Redis pub/sub to WebSocket forwarding
  redis-ws-gateway:
    build: .
    container_name: zerodha-redis-ws-gateway
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_WS_GATEWAY_HOST=0.0.0.0
      - REDIS_WS_GATEWAY_PORT=8889
      - PYTHONPATH=/app
      - REQUIRE_AUTH=false
      - DEFAULT_ROLE=user
    ports:
      - "8889:8889"
    volumes:
      - ./logs:/app/logs
    command: ["python", "-m", "redis_ws_gateway.main"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;urllib.request.urlopen('http://localhost:8889/health', timeout=5).read();sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - trading-network

  # Kite Authentication Service - Maintains valid tokens
  kite-auth-service:
    build: .
    container_name: zerodha-kite-auth-service
    depends_on:
      - redis
    environment:
      - KITE_API_KEY=${KITE_API_KEY:-mjs329hg8qn0wyx3}
      - KITE_API_SECRET=${KITE_API_SECRET:-hvfug2sn5h1xe1ky3qbuj1gsntd9kk86}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app:/app/market_data/src
    volumes:
      - ./credentials.json:/app/credentials.json
      - ./logs:/app/logs
    working_dir: /app
    command: ["python", "-m", "market_data.tools.kite_auth_service"]
    restart: unless-stopped
    networks:
      - trading-network

  # Market Data Dashboard Service - Standalone monitoring
  market-data-dashboard:
    build:
      context: ./market_data_dashboard
    container_name: zerodha-market-data-dashboard
    depends_on:
      market-data-api:
        condition: service_healthy
    environment:
      - MARKET_DATA_API_URL=http://market-data-api:8004
      - MARKET_DATA_DASHBOARD_PORT=8008
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8008:8008"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;urllib.request.urlopen('http://localhost:8008/api/health', timeout=5).read();sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - trading-network

  # Dashboard Backend Service - FastAPI analytics and risk endpoints
  dashboard-backend:
    build:
      context: .
      dockerfile: dashboard/Dockerfile.backend
    container_name: zerodha-dashboard-backend
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/zerodha_trading
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app:/app/dashboard:/app/dashboard/src:/app/engine_module/src:/app/market_data/src:/app/risk_module/src:/app/news_module/src:/app/user_module/src
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8001
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
    command: ["uvicorn", "dashboard.dashboard_pro:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;urllib.request.urlopen('http://localhost:8001/health', timeout=5).read();sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - trading-network

  # Dashboard Frontend Service - React/Vite UI
  dashboard-frontend:
    build:
      context: ./dashboard/modular_ui
      dockerfile: Dockerfile.frontend
    container_name: zerodha-dashboard-frontend
    depends_on:
      - dashboard-backend
    environment:
      - VITE_DASHBOARD_API_URL=http://localhost:8001
      - VITE_MARKET_API_URL=http://localhost:8001
      - VITE_NEWS_API_URL=http://news-api:8005
      - VITE_ENGINE_API_URL=http://engine-api:8006
      - VITE_USER_API_URL=http://user-api:8007
      - VITE_WS_URL=ws://redis-ws-gateway:8889
    ports:
      - "8888:8888"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - trading-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  trading-network:
    driver: bridge

  









